name: macOS plugin build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_BUILD_TYPE=Release
      - name: Build AU and VST3
        run: cmake --build build --config Release --target HALDEN_STARWIND_AU HALDEN_STARWIND_VST3
